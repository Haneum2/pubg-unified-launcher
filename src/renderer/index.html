<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>PUBG 통합 런처 (비공식)</title>
  <style>
    :root { --bg: #15171c; --panel: #1f2229; --line: #2d313a; --text: #e6e8eb; --muted: #8b919c; --accent: #f2a900; --ok: #4cc38a; --err: #ef5b5b; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.5 "Malgun Gothic", system-ui, sans-serif; }
    .tabs { display: flex; border-bottom: 1px solid var(--line); }
    .tabs button { flex: 1; padding: 14px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
    .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
    main { flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .info { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; color: var(--muted); font-size: 13px; }
    .info b { color: var(--text); font-weight: 600; }
    .link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
    #start { padding: 14px; border: 0; border-radius: 8px; background: var(--accent); color: #111; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
    #start:disabled { opacity: .5; cursor: default; }
    #status { min-height: 42px; }
    #status .label { font-weight: 700; }
    #status[data-phase="game"] .label { color: var(--ok); }
    #status[data-phase="failed"] .label { color: var(--err); }
    #status[data-phase="client"] .label, #status[data-phase="web"] .label { color: var(--accent); }
    footer { padding: 10px; text-align: center; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <nav class="tabs" role="tablist">
    <button role="tab" data-server="steam" aria-selected="false">Steam</button>
    <button role="tab" data-server="kakao" aria-selected="false">카카오</button>
  </nav>
  <main>
    <div class="info" id="info"></div>
    <button id="start">게임 시작</button>
    <div id="status" aria-live="polite"><div class="label"></div><div class="msg"></div></div>
  </main>
  <footer>비공식 프로젝트 · KRAFTON, Valve, 카카오게임즈와 관련이 없습니다.</footer>
  <script type="module" src="renderer.js"></script>
</body>
</html>
